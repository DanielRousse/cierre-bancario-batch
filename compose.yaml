services:
  mysql:
    image: mysql:8.4
    container_name: banco-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: banco_db
      MYSQL_USER: academia
      MYSQL_PASSWORD: academia123
    ports:
      - "3306:3306"
    volumes:
      - banco-mysql-data:/var/lib/mysql
    healthcheck:
      # Por TCP y con el usuario de la app: «healthy» solo llega cuando el usuario academia ya existe.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-uacademia", "-pacademia123"]
      interval: 5s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:8.2                  # fija: 8.3 y 8.0 NO arrancan con kernels de Linux 6.19 o más nuevos
    container_name: banco-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: academia
      MONGO_INITDB_ROOT_PASSWORD: academia123
    ports:
      - "27017:27017"
    volumes:
      - banco-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "academia", "-p", "academia123", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  banco-mysql-data:
  banco-mongo-data:
